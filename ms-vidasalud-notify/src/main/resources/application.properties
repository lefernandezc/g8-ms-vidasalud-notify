spring.application.name=notify

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Activar ACK/NACK manual
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Nombres de colas según el documento de arquitectura
messaging.queue.email=q.cmd.email
messaging.queue.admission=q.cmd.admission
messaging.queue.record=q.cmd.record